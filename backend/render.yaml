services:
  - type: web
    name: spotfreeze-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: SENDER_EMAIL
        sync: false
    disk:
      name: spotfreeze-data
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1
